<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתנות חתונה</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- <base href="/gifter/"> -->
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="מתנות לחתונה">
    <meta property="og:description" content="שלחו לנו מתנה!">
    <meta property="og:image" content="http://avih0.github.io/gifter/assets/og-default.jpg">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="מתנות לחתונה">
    <meta name="twitter:description" content="שלחו לנו מתנה!">
    <meta name="twitter:image" content="http://avih0.github.io/gifter/assets/og-default.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <button id="theme-toggle">מצב כהה</button>
        <button id="lang-toggle">English</button>
        <button id="page-qr-btn" title="Generate page QR code">🔗</button>
    </header>
    <main>
        <h1 id="title">טוען...</h1>
        <img id="wedding-img" src="assets/wedding.png" alt="תמונת חתונה">
        <p id="message">טוען...</p>
        <div id="gifts">
            טוען מתנות...
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/decrypt.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
<div id="share-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3 id="modal-title">Share</h3>
        <button id="copy-link">Copy Link</button>
        <button id="native-share">Share</button>
        <button id="show-qr">Show QR</button>
        <div id="qr-display"></div>
    </div>
</div><div id="page-qr-modal" class="modal page-qr-modal">
    <div class="modal-content page-qr-content">
        <span class="close-page-qr">&times;</span>
        <h3>קוד QR של הדף</h3>
        <canvas id="page-qr-display"></canvas>
        <button id="download-qr">הורד QR</button>
    </div>
</div>
